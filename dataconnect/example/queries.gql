mutation CreateUser @auth(level: USER) {
  user_insert(data: {id_expr: "auth.uid", username: "new_user", email: "user@example.com"})
}

mutation UpdateUserBio($bio: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {bio: $bio})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetCurrentUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    username email bio
  }
}

query ListAllUsers @auth(level: PUBLIC, insecureReason: "Public directory of usernames") {
  users {
    username
  }
}

mutation CreateProject($title: String!) @auth(level: USER) {
  project_insert(data: {title: $title, ownerId_expr: "auth.uid", createdAt_expr: "request.time"})
}

mutation UpdateProject($id: UUID!, $description: String) @auth(level: USER) {
  project_update(key: {id: $id}, data: {description: $description})
}

mutation DeleteProject($id: UUID!) @auth(level: USER) {
  project_delete(key: {id: $id})
}

query GetProject($id: UUID!) @auth(level: USER) {
  project(id: $id) {
    title description
  }
}

query ListMyProjects @auth(level: USER) {
  projects(where: {ownerId: {eq_expr: "auth.uid"}}) {
    title createdAt
  }
}

mutation CreateTask($title: String!, $projectId: UUID!) @auth(level: USER) {
  task_insert(data: {title: $title, status: "OPEN", projectId: $projectId})
}

mutation UpdateTaskStatus($id: UUID!, $status: String!) @auth(level: USER) {
  task_update(key: {id: $id}, data: {status: $status})
}

mutation DeleteTask($id: UUID!) @auth(level: USER) {
  task_delete(key: {id: $id})
}

query GetTask($id: UUID!) @auth(level: USER) {
  task(id: $id) {
    title status dueDate
  }
}

query ListProjectTasks($projectId: UUID!) @auth(level: USER) {
  tasks(where: {projectId: {eq: $projectId}}) {
    title status
  }
}

mutation AddProjectMember($projectId: UUID!, $userId: UUID!, $role: String!) @auth(level: USER) {
  projectMember_insert(data: {projectId: $projectId, userId: $userId, role: $role})
}

mutation UpdateMemberRole($id: UUID!, $role: String!) @auth(level: USER) {
  projectMember_update(key: {id: $id}, data: {role: $role})
}

mutation RemoveProjectMember($id: UUID!) @auth(level: USER) {
  projectMember_delete(key: {id: $id})
}

query GetMembers($projectId: UUID!) @auth(level: USER) {
  projectMembers(where: {projectId: {eq: $projectId}}) {
    user { username }
    role
  }
}

query ListMyMemberships @auth(level: USER) {
  projectMembers(where: {userId: {eq_expr: "auth.uid"}}) {
    project { title }
    role
  }
}

mutation AddComment($taskId: UUID!, $content: String!) @auth(level: USER) {
  comment_insert(data: {taskId: $taskId, authorId_expr: "auth.uid", content: $content, createdAt_expr: "request.time"})
}

mutation DeleteComment($id: UUID!) @auth(level: USER) {
  comment_delete(key: {id: $id})
}

query GetTaskComments($taskId: UUID!) @auth(level: USER) {
  comments(where: {taskId: {eq: $taskId}}) {
    content author { username }
  }
}